oss:
  # Server endpoint: used by the server for HeadObject, Delete, etc.
  # Falls back to client_upload_endpoint if not set.
  server_endpoint: ""
  # Client upload endpoint (required): public S3-compatible endpoint for browser direct upload via presigned URL.
  #   Aliyun OSS:  s3.oss-cn-hangzhou.aliyuncs.com
  #   AWS S3:      s3.us-east-1.amazonaws.com
  #   MinIO:       minio.example.com
  client_upload_endpoint: "s3.oss-cn-hangzhou.aliyuncs.com"
  # Client download endpoint: browser preview/download. CDN domain (with private bucket origin-pull) or public endpoint.
  client_download_endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket: ""
  region: "cn-hangzhou"
  # Optional instance boundary inside a shared bucket. Do not change this after
  # storing objects without first migrating them: changing the value switches
  # namespaces and does not move existing objects automatically.
  prefix: "domus/development"
  max_presign_batch: 100  # max presigned URLs returned per presign request

server:
  port: 8080
  pid_file: "domus.pid"
  cors_origins: ""  # optional, comma-separated origins for CORS when frontend and backend use different origins
  # example: "http://localhost:5173,https://app.example.com"
  # session_secret and encryption_secret are auto-generated on first startup
  # first startup root password: prefer a 0600 secret file; fallback env is DOMUS_ROOT_BOOTSTRAP_PASSWORD
  # ZEPHYR_ROOT_BOOTSTRAP_PASSWORD remains accepted during upgrades.
  root_bootstrap_password_file: ""

# DOFS is Domus' encrypted namespace/storage implementation. The Web process
# uses metadata.* directly. The remaining mount/control fields are only needed
# when exposing an optional Linux FUSE mount with `domus dofs serve`.
dofs:
  # SQLite is the default for one Domus server. Use `driver: postgres` only
  # when several DOFS hosts must share the same namespace metadata; PostgreSQL
  # then reuses database.* below.
  metadata:
    driver: "sqlite"
    sqlite:
      path: "/var/lib/domus/dofs/state/metadata.sqlite"
      busy_timeout_seconds: 5
      max_open_connections: 8
  # Optional Linux FUSE runtime paths. Keep plaintext writeback state on a
  # private encrypted local volume when the mount service is enabled.
  mount_root: "/var/lib/domus/dofs/mounts"
  state_root: "/var/lib/domus/dofs/state"
  control_socket: "/run/domus/dofs.sock"
  # Empty means owner-only (0600). Set a trusted group only when another local
  # process must request FUSE mounts.
  socket_group: ""
  # UID/GID presented through the optional FUSE filesystem.
  uid: 1000
  gid: 1000
  allow_other: false
  writable: true
  max_mounts: 32
  reconcile_interval_seconds: 30
  mount_timeout_seconds: 60
  shutdown_timeout_seconds: 30

log:
  level: "info"
  file: ""  # empty = stdout

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""
  dbname: "domus"
  sslmode: "disable"

upload:
  max_file_size: 10737418240  # 10GB

# SMTP (optional, required for email verification)
smtp:
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
